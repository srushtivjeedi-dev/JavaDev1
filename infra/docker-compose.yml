# Source (production-like) PostgreSQL for the CDC pipeline.
# wal_level=logical lets Debezium read row changes.
services:
  source-db:
    image: postgres:16
    container_name: shadowbase-source-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shop
    ports:
      - "5433:5432"
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
    volumes:
      - source-db-data:/var/lib/postgresql/data

volumes:
  source-db-data: